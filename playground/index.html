<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chicken Player — playground</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #111;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 8rem;
      gap: 2rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      font-weight: 800;
      letter-spacing: -.02em;
    }

    header p {
      margin-top: .4rem;
      color: #6b7280;
      font-size: .925rem;
    }

    .section {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    .section-label {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #9ca3af;
    }

    /* ── Boutons ── */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .5rem;
    }

    .controls-sep {
      width: 1px;
      height: 1.5rem;
      background: #e5e7eb;
      margin: 0 .25rem;
    }

    button {
      padding: .55rem .9rem;
      border-radius: .5rem;
      border: 1px solid #e5e7eb;
      background: #fff;
      cursor: pointer;
      font-size: .8rem;
      font-weight: 600;
      color: #374151;
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }

    button:hover {
      background: #f3f4f6;
      border-color: #d1d5db;
    }

    button.primary {
      background: #ea580c;
      border-color: #ea580c;
      color: #fff;
    }

    button.primary:hover {
      background: #c2410c;
      border-color: #c2410c;
    }

    button.danger {
      border-color: #fca5a5;
      color: #dc2626;
    }

    button.danger:hover {
      background: #fef2f2;
    }

    /* ── Grille des lecteurs ── */
    .players-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
    }

    .player-card {
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }

    .player-card-label {
      display: flex;
      align-items: center;
      gap: .4rem;
    }

    .badge {
      display: inline-block;
      font-size: .65rem;
      font-weight: 700;
      padding: .2rem .5rem;
      border-radius: .3rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .badge-yt { background: #fee2e2; color: #dc2626; }
    .badge-vm { background: #dbeafe; color: #2563eb; }
    .badge-dm { background: #f3e8ff; color: #7c3aed; }
    .badge-h5 { background: #dcfce7; color: #16a34a; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .players-grid {
        grid-template-columns: 1fr;
      }

      .controls-sep {
        display: none;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🐔 Chicken Player</h1>
    <p>Un player vidéo qui ne pond pas de problèmes.</p>
  </header>

  <div class="section">
    <span class="section-label">Contrôles</span>
    <div class="controls">
      <button class="primary" id="btn-consent">Consentir aux cookies</button>
      <button class="danger" id="btn-reject">Refuser les cookies</button>
      <div class="controls-sep"></div>
      <button id="btn-play">▶ Lire tout</button>
      <button id="btn-stop">■ Stopper tout</button>
    </div>
  </div>

  <div class="section">
    <span class="section-label">Plateformes</span>
    <div class="players-grid">

      <div class="player-card">
        <span class="player-card-label">
          <span class="badge badge-yt">YouTube</span>
        </span>
        <div class="chicken-player" data-type="youtube" data-id="IPfdLVxjJeo">
          <img src="https://img.youtube.com/vi/IPfdLVxjJeo/maxresdefault.jpg" alt="YouTube">
        </div>
      </div>

      <div class="player-card">
        <span class="player-card-label">
          <span class="badge badge-vm">Vimeo</span>
        </span>
        <div class="chicken-player" data-type="vimeo" data-id="524933864"></div>
      </div>

      <div class="player-card">
        <span class="player-card-label">
          <span class="badge badge-dm">Dailymotion</span>
        </span>
        <div class="chicken-player" data-type="dailymotion" data-id="x9k8k0y"></div>
      </div>

      <div class="player-card">
        <span class="player-card-label">
          <span class="badge badge-h5">HTML5</span>
        </span>
        <div class="chicken-player" data-type="html5"
          data-id="https://examplefiles.org/files/video/mp4-example-video-download-full-hd-1920x1080.mp4"></div>
      </div>

    </div>
  </div>

  <script type="module">
    import ChickenPlayer from '../src/js/index.js';

    const player = new ChickenPlayer({
      selector: '.chicken-player',
      cookies: {
        active: true,
        types: ['youtube', 'vimeo', 'dailymotion'],
      },
    });

    document.getElementById('btn-consent').onclick = () =>
      window.dispatchEvent(new Event('chickenPlayer.cookies.consent'));
    document.getElementById('btn-reject').onclick = () =>
      window.dispatchEvent(new Event('chickenPlayer.cookies.reject'));
    document.getElementById('btn-play').onclick = () => player.play();
    document.getElementById('btn-stop').onclick = () => player.stop();
  </script>

</body>

</html>
